<!DOCTYPE html>
<html>
<head>
    <title>SOLID OS - GATEWAY</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; text-align: center; padding: 50px; }
        input { padding: 10px; width: 300px; background: #111; color: #0f0; border: 1px solid #0f0; }
        button { padding: 10px 20px; background: #0f0; color: #000; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>SOLID OS - VALIDATION PORTAL</h1>
    <p>ENTER EAK FOR SETTLEMENT STATUS</p>
    <input type="text" id="eakInput" placeholder="Enter EAK (e.g., AMZ-G5-992)">
    <button onclick="runTest()">VALIDATE</button>

    <script>
        // THE DATA & LOGIC INJECTED DIRECTLY
        const MANIFEST = {
            "AMZ-G5-992": { "reason": "UNPAID_GOVERNANCE_FEES", "share": "5%_REV_SHARE" },
            "DAL-BRG-453": { "reason": "UNAUTHORIZED_USAGE", "value": "210,000,000.00" }
        };

        function runTest() {
            const key = document.getElementById('eakInput').value.toUpperCase();
            const entry = MANIFEST[key];
            if (entry) {
                alert("NODE FOUND!\nSTATUS: " + entry.reason + "\nPROPRIETOR: Solid LP");
            } else {
                alert("ACCESS DENIED: ENTITY NOT FOUND IN 44K LEDGER");
            }
        }
    </script>
</body>
</html>
