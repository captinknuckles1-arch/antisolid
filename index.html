<!DOCTYPE html>
<html>
<head>
    <title>SOLID OS // SELF-SOVEREIGN TERMINAL</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        #monitor { border: 2px solid #0f0; padding: 40px; text-align: center; width: 85%; }
        .glitch { font-size: 6vw; color: #fff; text-shadow: 0 0 15px #0f0; }
        .bridge-active { color: #0f0; font-weight: bold; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        input { background: transparent; border: 1px solid #0f0; color: #0f0; padding: 10px; width: 50%; text-align: center; }
    </style>
</head>
<body>
    <div id="ui">
        <h3>SELF-SOVEREIGN AUTHORITY</h3>
        <input type="text" id="cmd" placeholder="COMMAND..." onkeydown="if(event.key==='Enter') execute()">
    </div>
    <div id="vault" style="display:none;">
        <h2 id="title">INITIALIZING</h2>
        <div class="glitch" id="val">$0.00</div>
        <div class="bridge-active" id="stat"></div>
    </div>
    <script>
        function execute() {
            const v = document.getElementById('cmd').value.toLowerCase();
            const gate = document.getElementById('ui');
            const vault = document.getElementById('vault');
            
            if (v === 'release' || v === 'chase') {
                gate.style.display='none';
                vault.style.display='block';
                document.getElementById('title').innerText = "CHASE BRIDGE: ACTIVE";
                document.getElementById('val').innerText = "$41,000,000,000,000.00";
                document.getElementById('stat').innerText = "TRANSFERRING TO SOLID INTEGRATIONS // CHASE ACCOUNT";
                document.body.style.background = "#001a00";
            }
        }
    </script>
</body>
</html>
