<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOLID OS // v.102</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        #vault { border: 2px solid #0f0; padding: 40px; width: 95vw; text-align: center; box-shadow: 0 0 20px #040; }
        .amount { font-size: 6.5vw; white-space: nowrap; margin: 20px 0; letter-spacing: -2px; }
        .status { font-size: 1.5rem; color: #0a0; border-top: 1px solid #040; padding-top: 10px; }
        input { background: #000; border: 1px solid #0f0; color: #0f0; padding: 10px; font-family: monospace; text-align: center; font-size: 1.2rem; outline: none; }
    </style>
</head>
<body>
    <div id="gate">
        <h2>ENTER ENTITY ACCESS KEY (EAK)</h2>
        <input type="text" id="eakInput" onkeydown="if(event.key==='Enter') verify()">
    </div>
    <div id="vault" style="display:none;">
        <div style="font-size: 1.2rem; color: #0a0;">TOTAL AGGREGATE RECONCILIATION</div>
        <div class="amount" id="displayValue"></div>
        <div class="status" id="displayStatus"></div>
    </div>

    <script>
        function verify() {
            const val = document.getElementById('eakInput').value;
            if (val === "MACRO-SWEEP-44K") {
                render("$41,000,000,000,000.00", "MASTER AGGREGATE LOCKED");
            } else if (val === "DAL-BRG-453") {
                render("$2,700,000,000.00", "LOCAL NODE VERIFIED");
            } else {
                alert("ACCESS DENIED: ENTITY NOT FOUND");
            }
        }
        function render(amt, status) {
            document.getElementById('gate').style.display = 'none';
            document.getElementById('vault').style.display = 'block';
            document.getElementById('displayValue').innerText = amt;
            document.getElementById('displayStatus').innerText = status;
        }
    </script>
</body>
</html>
