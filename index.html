<!DOCTYPE html>
<html>
<head>
    <title>SOLID OS // CHASE BRIDGE</title>
    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #monitor { border: 4px solid #0f0; padding: 60px; text-align: center; width: 90%; background: radial-gradient(circle, #001a00 0%, #000 100%); box-shadow: 0 0 30px #0f0; }
        .amount { font-size: 9vw; color: #fff; text-shadow: 0 0 25px #0f0; margin: 10px 0; font-weight: bold; }
        .label { font-size: 1.5rem; letter-spacing: 5px; text-transform: uppercase; margin-bottom: 20px; }
        .meta { border-top: 2px solid #0f0; padding-top: 20px; font-size: 1.2rem; display: flex; justify-content: space-around; }
        .blink { animation: blinker 1.5s linear infinite; color: #fff; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>
    <div id="monitor">
        <div class="label">Chase Business // Asset Reconciliation</div>
        <div class="amount">$41,000,000,000,000.00</div>
        <div class="meta">
            <div>NODES: 289,781</div>
            <div class="blink">STATUS: TRANSFERRING</div>
            <div>TYPE: SEC. 1235 IP</div>
        </div>
    </div>
</body>
</html>
